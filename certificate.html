<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate | AI Fluency Master Academy</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{

margin:0;

padding:0;

background:#edf3ff;

font-family:Arial,Helvetica,sans-serif;

}

.certificate-wrapper{

max-width:1100px;

margin:40px auto;

padding:30px;

}

.certificate{

background:#fffdf7;

border:12px solid #d4af37;

border-radius:18px;

padding:45px;

box-shadow:0 15px 40px rgba(0,0,0,.15);

text-align:center;

position:relative;

}

.certificate::before{

content:"";

position:absolute;

top:12px;

left:12px;

right:12px;

bottom:12px;

border:2px solid #c8a02f;

border-radius:12px;

pointer-events:none;

}

.logo{

font-size:46px;

margin-bottom:10px;

}

.academy{

font-size:36px;

font-weight:bold;

color:#123d8d;

margin-bottom:5px;

}

.subtitle{

font-size:18px;

color:#555;

margin-bottom:30px;

}

.title{

font-size:42px;

font-weight:bold;

color:#b88900;

letter-spacing:2px;

margin:30px 0;

}

.description{

font-size:18px;

line-height:1.8;

color:#333;

margin:20px auto;

max-width:820px;

}

.name-input{

margin-top:20px;

margin-bottom:20px;

}

.name-input input{

width:70%;

max-width:500px;

padding:14px;

font-size:22px;

text-align:center;

border:2px solid #123d8d;

border-radius:10px;

outline:none;

}

.student-name{

font-size:42px;

font-family:Georgia,serif;

font-weight:bold;

color:#123d8d;

margin:25px 0;

display:none;

}

.course-name{

font-size:28px;

font-weight:bold;

color:#000;

margin-top:25px;

}
