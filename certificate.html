<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Fluency Master Academy Certificate</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{

margin:0;

padding:40px;

background:#eef3fb;

font-family:Georgia,serif;

}

.certificate-wrapper{

max-width:1100px;

margin:auto;

background:white;

border:12px solid #c79a1b;

padding:18px;

box-shadow:0 20px 45px rgba(0,0,0,.25);

}

.certificate{

border:3px solid #d9b85f;

padding:55px;

background:#fffdf8;

position:relative;

min-height:900px;

}

.corner{

position:absolute;

font-size:42px;

color:#c79a1b;

}

.top-left{

top:18px;

left:18px;

}

.top-right{

top:18px;

right:18px;

transform:scaleX(-1);

}

.bottom-left{

bottom:18px;

left:18px;

transform:scaleY(-1);

}

.bottom-right{

bottom:18px;

right:18px;

transform:rotate(180deg);

}

.academy{

text-align:center;

margin-top:15px;

}

.academy h1{

margin:10px 0;

font-size:46px;

color:#082b63;

}

.subtitle{

font-size:22px;

letter-spacing:2px;

color:#b18608;

font-weight:bold;

margin-bottom:30px;

}

.main-title{

text-align:center;

font-size:62px;

font-weight:bold;

color:#0a2a66;

margin-top:30px;

}

.presented{

text-align:center;

font-size:24px;

margin-top:50px;

}

</style>

</head>

<body>

<div class="certificate-wrapper">

<div class="certificate">

<div class="corner top-left">❦</div>

<div class="corner top-right">❦</div>

<div class="corner bottom-left">❦</div>

<div class="corner bottom-right">❦</div>

<div class="academy">

<div style="font-size:65px;">🏆</div>

<h1>AI Fluency Master Academy</h1>

<div class="subtitle">

PROFESSIONAL CERTIFICATE OF ACHIEVEMENT

</div>

</div>

<div class="main-title">

CERTIFICATE OF COMPLETION

</div>

<div class="presented">

This certificate is proudly presented to

</div>
